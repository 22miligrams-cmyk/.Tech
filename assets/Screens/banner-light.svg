<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label=".Tech — Hyprland desktop shell built on Quickshell" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .title   { font: 600 64px ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #17181c; }
      .sub     { font: 400 20px ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #5b5f6b; }
      .badge   { font: 500 13px ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #8b909c; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#f7f7f8"/>

  <!-- left-aligned title block -->
  <text x="64" y="140" class="title">.Tech</text>
  <text x="68" y="172" class="sub">hyprland desktop shell · quickshell · qml</text>
  <text x="68" y="206" class="badge">ru / en · MIT</text>

  <!-- status-bar mockup, the project's own subject matter -->
  <g transform="translate(740,119)">
    <rect x="0" y="0" width="380" height="62" rx="31" fill="#ffffff" stroke="#e2e4e8" stroke-width="1.5"/>

    <!-- workspace indicators -->
    <g transform="translate(26,21)">
      <rect x="0"  y="0" width="10" height="20" rx="3" fill="#3f72af"/>
      <rect x="18" y="4" width="10" height="12" rx="3" fill="#d4d7dd"/>
      <rect x="36" y="4" width="10" height="12" rx="3" fill="#d4d7dd"/>
      <rect x="54" y="4" width="10" height="12" rx="3" fill="#d4d7dd"/>
    </g>

    <line x1="132" y1="14" x2="132" y2="48" stroke="#e2e4e8" stroke-width="1.5"/>

    <!-- signal / status icons -->
    <g transform="translate(154,22)">
      <rect x="0"  y="12" width="6" height="6"  rx="1.5" fill="#9ba0ac"/>
      <rect x="10" y="8"  width="6" height="10" rx="1.5" fill="#9ba0ac"/>
      <rect x="20" y="4"  width="6" height="14" rx="1.5" fill="#9ba0ac"/>
      <circle cx="46" cy="11" r="5" fill="#3f72af"/>
    </g>

    <line x1="238" y1="14" x2="238" y2="48" stroke="#e2e4e8" stroke-width="1.5"/>

    <!-- clock pill -->
    <rect x="260" y="19" width="94" height="24" rx="12" fill="#f1f2f4"/>
    <circle cx="276" cy="31" r="4" fill="#3f72af"/>
  </g>
</svg>
